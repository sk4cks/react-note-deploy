# Argo CD UI — nip.io + HTTPS (note-app Application 경로 밖, 수동/setup 스크립트용)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - argocd.13.239.220.205.nip.io
      secretName: argocd-tls
  rules:
    - host: argocd.13.239.220.205.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
