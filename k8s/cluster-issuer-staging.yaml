apiVersion: cert-manager.io/v1
kind: ClusterIssuer # 테스트용 발급자. 브라우저가 신뢰하지 않음
metadata: # 이름·라벨·소속
  name: letsencrypt-staging
spec: # 이 객체의 동작 정의
  acme: # Let's Encrypt 계정 설정
    server: https://acme-staging-v02.api.letsencrypt.org/directory # 테스트 서버. 발급 횟수 제한이 느슨함
    email: sk4cks@gmail.com
    privateKeySecretRef: # 계정 키를 저장할 Secret
      name: letsencrypt-staging-account-key
    solvers: # 도메인 소유 확인 방법
      - http01:
          ingress: # 챌린지를 띄울 Ingress
            ingressClassName: traefik
