apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: note
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
    spec:
      containers:
        - name: auth-server
          image: 019511184889.dkr.ecr.ap-northeast-2.amazonaws.com/auth-server:1
          ports:
            - containerPort: 9000
          env:
            - name: SERVER_PORT
              value: "9000"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/authorization-api"
            - name: SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER
              value: "https://auth.52.78.20.70.nip.io"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-server-google
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-server-google
                  key: client-secret
            - name: KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-server-kakao
                  key: client-id
            - name: KAKAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-server-kakao
                  key: client-secret
            - name: NAVER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-server-naver
                  key: client-id
            - name: NAVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-server-naver
                  key: client-secret
            - name: AUTH_INTERNAL_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: react-note-api-config
                  key: AUTH_INTERNAL_API_KEY
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            # Mailcow: 서울 메일 EC2 준비 후 다시 enable (지금은 앱 이전만)
            - name: MAIL_DOMAIN
              value: "note.local"
            - name: MAILCOW_ENABLED
              value: "false"
            - name: MAILBOX_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-server-mail
                  key: MAILBOX_PASSWORD_SECRET
            - name: MAILBOX_PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: auth-server-mail
                  key: MAILBOX_PASSWORD_SALT
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  namespace: note
spec:
  selector:
    app: auth-server
  ports:
    - port: 9000
      targetPort: 9000
