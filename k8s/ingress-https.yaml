# Elastic IP + nip.io + HTTPS
# 1) 아래 52.78.20.70 를 탄력적 IP로 교체 (예: 3.25.208.109)
# 2) cert-manager ClusterIssuer 적용 후 이 파일 apply
# 3) cert-manager.io/cluster-issuer: letsencrypt-prod (브라우저 신뢰용)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: note-ingress
  namespace: note
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.52.78.20.70.nip.io
        - api.52.78.20.70.nip.io
        - auth.52.78.20.70.nip.io
      secretName: note-tls
  rules:
    - host: app.52.78.20.70.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-note
                port:
                  number: 80
    - host: api.52.78.20.70.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-note-api
                port:
                  number: 8082
    - host: auth.52.78.20.70.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-server
                port:
                  number: 9000
