# k8s/ 밖이라 Argo note-app 이 적용하지 않음. 서버에서 직접 apply.
apiVersion: v1
kind: ConfigMap
metadata: # 이름·라벨·소속
  name: jenkins-ci-scripts
  namespace: jenkins
data: # 이 객체에 넣을 내용
  install-ci-tools.sh: | # 기동 시 실행할 스크립트. docker CLI 와 AWS CLI 설치
    #!/usr/bin/env bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    if ! command -v docker >/dev/null 2>&1; then
      apt-get update -qq
      apt-get install -y -qq docker.io
    fi
    if ! command -v aws >/dev/null 2>&1; then
      apt-get install -y -qq curl unzip ca-certificates
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
      unzip -q /tmp/awscliv2.zip -d /tmp
      /tmp/aws/install --update
      rm -rf /tmp/aws /tmp/awscliv2.zip
    fi
---
apiVersion: v1
kind: PersistentVolumeClaim # Jenkins 홈 디스크 요청. local-path 라 만든 노드에 고정
metadata: # 이름·라벨·소속
  name: jenkins-home
  namespace: jenkins
spec: # 이 객체의 동작 정의
  accessModes: # 디스크를 열고 쓰는 방식
    - ReadWriteOnce # 노드 하나에서만 마운트
  resources: # 자원 요청과 상한
    requests: # 스케줄에 필요한 최소량
      storage: 10Gi # 요청 용량
---
apiVersion: apps/v1
kind: Deployment
metadata: # 이름·라벨·소속
  name: jenkins
  namespace: jenkins
spec: # 이 객체의 동작 정의
  replicas: 1
  selector: # 대상 파드를 고르는 조건
    matchLabels: # 라벨이 모두 같아야 선택
      app: jenkins
  template: # 새로 만들 파드의 틀
    metadata: # 이름·라벨·소속
      labels: # 객체에 붙이는 표시
        app: jenkins
    spec: # 이 객체의 동작 정의
      serviceAccountName: default # 파드가 쓸 서비스 계정
      nodeSelector: # 배치할 노드 조건
        node-role.kubernetes.io/control-plane: "true" # 앱 서버만 선택. 디스크가 그 노드에 있음
      containers: # 파드 안에서 실행할 컨테이너 목록
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17 # Jenkins LTS, JDK 17
          command: ["/bin/bash", "-c"] # 이미지 기본 명령 대신 이 명령 실행
          args: # 실행 인자
            - | # 도구 설치 후 Jenkins 프로세스로 교체
              bash /scripts/install-ci-tools.sh
              exec /usr/local/bin/jenkins.sh
          ports: # 수신 포트 목록
            - containerPort: 8080 # 웹 화면
              name: http # 포트 이름
            - containerPort: 50000 # 빌드 에이전트 접속
              name: agent
          env: # 개별 환경변수 목록
            - name: JAVA_OPTS # JVM 옵션
              value: "-Djenkins.install.runSetupWizard=true" # 처음 기동 시 설치 마법사 표시
          volumeMounts: # 컨테이너 안에 연결할 경로
            - name: jenkins-home
              mountPath: /var/jenkins_home # 설정·잡 저장 경로
            - name: docker-sock
              mountPath: /var/run/docker.sock # 앱 서버 Docker 소켓. 이미지 빌드용
            - name: ci-scripts
              mountPath: /scripts # 설치 스크립트 마운트 경로
              readOnly: true # 읽기 전용
          resources: # 자원 요청과 상한
            requests: # 스케줄에 필요한 최소량
              memory: "1Gi"
              cpu: "500m"
            limits: # 사용 상한
              memory: "2Gi" # 메모리 상한
              cpu: "1500m" # CPU 상한
          securityContext: # 컨테이너 권한
            privileged: true # 호스트 Docker 소켓 사용을 위한 특권 모드
            runAsUser: 0 # root 로 실행
      volumes: # 파드에 붙일 저장소 목록
        - name: jenkins-home
          persistentVolumeClaim: # 요청해 둔 디스크 연결
            claimName: jenkins-home
        - name: docker-sock
          hostPath: # 노드의 파일 또는 디렉터리
            path: /var/run/docker.sock # 앱 서버의 Docker 소켓
            type: Socket # 소켓 파일이어야 함
        - name: ci-scripts
          configMap:
            name: jenkins-ci-scripts
            defaultMode: 0755 # 마운트한 파일을 실행 가능하게 설정
---
apiVersion: v1
kind: Service
metadata: # 이름·라벨·소속
  name: jenkins
  namespace: jenkins
spec: # 이 객체의 동작 정의
  selector: # 대상 파드를 고르는 조건
    app: jenkins
  ports: # 수신 포트 목록
    - name: http
      port: 8080 # 서비스 포트
      targetPort: 8080 # 컨테이너 포트
    - name: agent
      port: 50000
      targetPort: 50000
---
apiVersion: networking.k8s.io/v1
kind: Ingress # Jenkins 화면 주소
metadata: # 이름·라벨·소속
  name: jenkins-ingress
  namespace: jenkins
  annotations: # 스케줄과 무관한 부가 정보
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec: # 이 객체의 동작 정의
  tls: # HTTPS 인증서를 붙일 호스트
    - hosts:
        - jenkins.52.78.20.70.nip.io
      secretName: jenkins-tls # 인증서 저장 Secret
  rules: # 호스트별 라우팅
    - host: jenkins.52.78.20.70.nip.io
      http: # 이 호스트의 HTTP 라우팅
        paths: # URL 경로별 목적지
          - path: /
            pathType: Prefix
            backend: # 실제로 받을 서비스
              service: # 연결할 Service
                name: jenkins
                port: # 서비스 또는 컨테이너 포트
                  number: 8080 # 웹 포트만 외부로 연결. 에이전트 50000 은 제외
