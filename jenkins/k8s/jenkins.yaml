# Jenkins (학습용) — note-app Argo 경로(k8s/) 밖, 수동 apply
# EC2 호스트에 Docker 필요: scripts/install-docker-ec2.sh
# Pod 기동 시 docker CLI + AWS CLI v2 설치 (Jenkinsfile apt-get || true 금지)
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-ci-scripts
  namespace: jenkins
data:
  install-ci-tools.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    if ! command -v docker >/dev/null 2>&1; then
      apt-get update -qq
      apt-get install -y -qq docker.io
    fi
    if ! command -v aws >/dev/null 2>&1; then
      apt-get install -y -qq curl unzip ca-certificates
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
      unzip -q /tmp/awscliv2.zip -d /tmp
      /tmp/aws/install --update
      rm -rf /tmp/aws /tmp/awscliv2.zip
    fi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: default
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /scripts/install-ci-tools.sh
              exec /usr/local/bin/jenkins.sh
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=true"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: ci-scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          securityContext:
            privileged: true
            runAsUser: 0
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: ci-scripts
          configMap:
            name: jenkins-ci-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
  namespace: jenkins
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - jenkins.13.239.220.205.nip.io
      secretName: jenkins-tls
  rules:
    - host: jenkins.13.239.220.205.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
